# Префикс на Ctrl+a (удобнее, как в screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Мышь: скролл, выделение, ресайз панелей
set -g mouse on

# Нумерация с 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Больше истории прокрутки
set -g history-limit 50000

# Быстрый reload конфига
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Удобное разделение с сохранением текущего пути
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Навигация в стиле vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vi-режим в copy-mode + копирование в буфер macOS
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Нормальные цвета (важно для iTerm2/Alacritty)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Не задерживать Esc (важно для vim/neovim)
set -sg escape-time 10
