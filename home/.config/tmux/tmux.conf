# Shared configuration for macOS, Linux Desktop, and Linux VM (tmux 3.2+).
set -g default-shell /bin/zsh
unbind -q C-b
set -g prefix C-a
bind C-a send-prefix
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
# Drop the old Linux-only battery command when reloading an existing server.
set -gu status-right

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g default-terminal "screen-256color"
set -s 'terminal-overrides[10]' '*256col*:Tc'
set -sg escape-time 10

# OSC 52 also carries clipboard writes through SSH and nested tmux instances.
set -s set-clipboard on
set -s 'terminal-features[10]' 'screen*:clipboard'
set -s 'terminal-features[11]' 'tmux*:clipboard'
set -s 'terminal-features[12]' 'alacritty*:clipboard'
set -s 'terminal-features[13]' 'foot*:clipboard'
set -s copy-command 'sh "$HOME/.config/tmux/clipboard.sh"'
# Bridge clipboard writes from nested tmux/Neovim to a local desktop clipboard.
set-hook -g 'pane-set-clipboard[10]' {
    run-shell -b 'tmux save-buffer - | sh "$HOME/.config/tmux/clipboard.sh"'
}

# Releasing the mouse freezes the selection; copying is an explicit action.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# Double/triple click select a word/line without the default automatic copy/exit.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X stop-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X stop-selection
bind -n DoubleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H; send -X select-word; send -X stop-selection'
bind -n TripleClick1Pane select-pane -t= \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -H; send -X select-line; send -X stop-selection'
