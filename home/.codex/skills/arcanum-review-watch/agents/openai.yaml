  short_description: "Черновики ревью чужого PR и ответов — каждые 15 минут"
  default_prompt: "Используй $arcanum-review-watch: следи за указанным чужим PR каждые 15 минут, проводи полноценное ревью и обрабатывай ответы на свои issues; все исходящие сообщения сохраняй как drafts до моего подтверждения."
