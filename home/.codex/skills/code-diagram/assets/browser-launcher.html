<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>draw.io</title>
  <style>
    html, body { height: 100%; margin: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <noscript>Enable JavaScript to open this diagram in draw.io.</noscript>
  <iframe id="editor" title="draw.io diagram editor" allow="clipboard-read; clipboard-write"></iframe>
  <script id="diagram-data" type="application/json">__DRAWIO_PAYLOAD__</script>
  <script id="drawio-bridge">
    "use strict";
    const diagram = JSON.parse(document.getElementById("diagram-data").textContent);
    const editor = document.getElementById("editor");
    const origin = "https://embed.diagrams.net";
    document.title = diagram.title + " — draw.io";

    function send(message) {
      editor.contentWindow.postMessage(JSON.stringify(message), origin);
    }

    window.addEventListener("message", (event) => {
      if (event.origin !== origin || event.source !== editor.contentWindow) return;
      let message;
      try { message = JSON.parse(event.data); } catch (_) { return; }
      if (!message || typeof message !== "object") return;
      if (message.event === "init") {
        send({action: "load", xml: diagram.xml, title: diagram.title, autosave: 0, fit: 1});
      } else if (message.event === "save" && typeof message.xml === "string" && message.xml.length > 0) {
        const blob = new Blob([message.xml], {type: "application/vnd.jgraph.mxfile;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = diagram.title;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        diagram.xml = message.xml;
        send({action: "status", message: "", modified: false});
      }
    });

    // Register the listener before navigating the iframe. XML travels only in postMessage.
    editor.src = origin + "/?embed=1&proto=json&spin=1&libraries=1&noExitBtn=1&saveAndExit=0&stealth=1";
  </script>
</body>
</html>
